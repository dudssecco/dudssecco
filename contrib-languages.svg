<rect class="s" x="366.79" y="70" width="0.81" height="10" fill="#a91e50" style="animation-delay:1.5s"/>
<rect class="s" x="367.1" y="70" width="1.4" height="10" fill="#8b949e" style="animation-delay:1.75s"/>
</g>
<g class="g" style="animation-delay:0.6s"><circle cx="25" cy="110" r="5" fill="#f1e05a"/><text x="38" y="114" font-size="12" font-weight="600" fill="#1f2328">JavaScript</text><text x="180" y="114" font-size="12" text-anchor="end" fill="#59636e">94.7%</text></g>
