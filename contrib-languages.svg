<svg xmlns="http://www.w3.org/2000/svg" width="388" height="270" viewBox="0 0 388 270">
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans",Helvetica,Arial,sans-serif}
.s{transform-box:fill-box;transform-origin:0 50%;animation:seg 12s ease-out infinite both}
.g{animation:leg 12s ease infinite both}
@keyframes seg{0%{transform:scaleX(0)}5%{transform:scaleX(1)}88%{transform:scaleX(1)}95%,100%{transform:scaleX(0)}}
@keyframes leg{0%{opacity:0;transform:translateY(6px)}5%{opacity:1;transform:none}88%{opacity:1}94%,100%{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<text x="20" y="24" font-size="16" font-weight="600" fill="#1f2328">Top languages</text>
<text x="20" y="46" font-size="12" fill="#59636e">By code size across public repositories</text>
<clipPath id="lc"><rect x="20" y="70" width="348" height="10" rx="5"/></clipPath>
<g clip-path="url(#lc)">
<rect class="s" x="20" y="70" width="329.96" height="10" fill="#f1e05a" style="animation-delay:0s"/>
<rect class="s" x="349.46" y="70" width="6.72" height="10" fill="#663399" style="animation-delay:0.25s"/>
<rect class="s" x="355.68" y="70" width="5.2" height="10" fill="#e34c26" style="animation-delay:0.5s"/>
