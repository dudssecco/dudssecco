<g class="g" style="animation-delay:1.08s"><circle cx="25" cy="170" r="5" fill="#3178c6"/><text x="38" y="174" font-size="12" font-weight="600" fill="#1f2328">TypeScript</text><text x="180" y="174" font-size="12" text-anchor="end" fill="#59636e">0.5%</text></g>
