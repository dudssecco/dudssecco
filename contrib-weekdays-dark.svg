<svg xmlns="http://www.w3.org/2000/svg" width="388" height="331" viewBox="0 0 388 331">
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans",Helvetica,Arial,sans-serif}
.w{transform-box:fill-box;transform-origin:0 50%;animation:bar 12s cubic-bezier(.2,.8,.3,1) infinite both}
.v{animation:val 12s ease infinite both}
@keyframes bar{0%{transform:scaleX(0)}10%{transform:scaleX(1)}88%{transform:scaleX(1)}95%,100%{transform:scaleX(0)}}
@keyframes val{0%,8%{opacity:0}12%{opacity:1}88%{opacity:1}94%,100%{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
