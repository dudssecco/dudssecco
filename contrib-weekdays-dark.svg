<style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans",Helvetica,Arial,sans-serif}
.w{transform-box:fill-box;transform-origin:0 50%;animation:bar 12s cubic-bezier(.2,.8,.3,1) infinite both}
.v{animation:val 12s ease infinite both}
